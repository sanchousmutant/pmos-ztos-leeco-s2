Section "ServerFlags"
  Option "BlankTime" "0"
  Option "StandbyTime" "0"
  Option "SuspendTime" "0"
  Option "OffTime" "0"
  Option "DPMS" "false"
EndSection

Section "Device"
  Identifier "Configured Video Device"
  Driver "fbdev"
  Option "fbdev" "/dev/graphics/fb0"
  Option "ShadowFB" "off"
EndSection

Section "Screen"
  Identifier "Default Screen"
  Device "Configured Video Device"
  DefaultDepth 24
  SubSection "Display"
    Depth 24
    FbBpp 32
  EndSubSection
EndSection
