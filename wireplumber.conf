# LeEco Le 2 (s2): the ACP default profile for this board is "off" and the
# only usable output is the pro-audio profile.  WirePlumber's "find-best"
# logic deliberately skips pro-audio, so express it as a user preference.
# This works on a fresh state directory, without a manual pactl call.

device.profile.priority.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-c051000.sound" }
    ]
    actions = {
      update-props = {
        priorities = [ "pro-audio" ]
      }
    }
  }
]

monitor.alsa.rules = [
  # pro-output-2 (MultiMedia3) cannot open an ASM write stream on this DSP once
  # the Quinary MI2S backend has been claimed by MultiMedia1.  Every retry
  # returns "DSP returned error[9]" and wedges the ADSP ASM for *all* streams,
  # so MultiMedia1 then fails too and the speaker goes silent (BR-031).
  {
    matches = [
      { node.name = "~alsa_output.*pro-output-2" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  },
  # pro-input-1 (MultiMedia2 capture) has no ADC/MIC BIAS backend wired in the
  # DTS yet: arecord gets -EINVAL on open.  Keep the node out of the graph.
  {
    matches = [
      { node.name = "~alsa_input.*pro-input-1" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  },
  {
    matches = [
      { node.name = "~alsa_output.*pro-output-0" }
    ]
    actions = {
      update-props = {
        priority.session = 2100
        priority.driver = 2100
        node.description = "Speaker (TFA9890)"
        node.nick = "Speaker"
      }
    }
  }
]
