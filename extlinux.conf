timeout 10
default mainline

label s2
	kernel /vmlinuz
	fdt /s2.dtb
	initrd /initramfs-tiny.switch
	append boot_cpus=0,1,2,3,4,5 sched_enable_hmp=1 lpm_levels.sleep_disabled=1 consoleblank=0 random.trust_cpu=on console=ttyHSL1,115200n8 loglevel=8 pstore.backend=ramoops ramoops.mem_address=0x9ff00000 ramoops.mem_size=0x100000 ramoops.console_size=0x60000 pmos_root=/dev/mmcblk0p56 mdss_mdp.panel=1:dsi:0:qcom,mdss_dsi_boe_nt35596s_fhd_5p5boe_vdo:1:none:cfg:single_dsi mdss_dsi.dsi_status_disable=1

label mainline
	kernel /Image
	fdt /msm8976-leeco-s2.dtb
	initrd /initramfs-tiny.switch
	append console=ttyMSM0,115200n8 earlycon=msm_serial,0x78b0000 consoleblank=0 loglevel=8 pstore.backend=ramoops pmos_root=/dev/mmcblk0p56 clk_ignore_unused cma=96M
