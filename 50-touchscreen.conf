Section "InputClass"
    Identifier "synaptics touchscreen"
    MatchDevicePath "/dev/input/event0"
    Driver "libinput"
    Option "SendCoreEvents" "true"
EndSection

Section "InputClass"
    Identifier "hardware buttons"
    MatchDevicePath "/dev/input/event4"
    Driver "libinput"
    Option "SendCoreEvents" "true"
EndSection
