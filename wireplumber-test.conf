# Temporary test config: keep pro-audio profile, keep both pro outputs,
# disable only the broken capture node (MultiMedia2 has no capture backend).

device.profile.priority.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-c051000.sound" }
    ]
    actions = {
      update-props = {
        priorities = [ "pro-audio" ]
      }
    }
  }
]

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.*pro-input-1" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
